<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tokenhaus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --accent: #d4d4d4;
      --accent-dim: rgba(212,212,212,0.08);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.10);
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e5e5e5;
      --muted: #737373;
      --radius: 8px;
    }

    html, body {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── Collapsed state ───────────────────────────────── */
    body.collapsed {
      height: 48px;
    }

    body.collapsed #main-content { display: none; }

    /* ── Header ────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 8px;
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      user-select: none;
      cursor: default;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #logo {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #app-name {
      font-weight: 500;
      font-size: 13px;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* MCP Status badge */
    #mcp-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: all 0.3s;
    }

    #mcp-badge.connected {
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid rgba(74,222,128,0.2);
    }

    #mcp-badge.disconnected {
      background: rgba(115,115,115,0.10);
      color: var(--muted);
      border: 1px solid rgba(115,115,115,0.18);
    }

    #mcp-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    #mcp-badge.connected .dot {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Collapse toggle */
    #toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s, background 0.2s;
      width: auto;
      margin: 0;
    }

    #toggle-btn:hover {
      color: var(--text);
      background: var(--surface2);
    }

    #toggle-btn svg {
      transition: transform 0.25s ease;
    }

    body.collapsed #toggle-btn svg {
      transform: rotate(180deg);
    }

    /* ── Main content ───────────────────────────────────── */
    #main-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Job Queue ─────────────────────────────────────── */
    #queue-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #queue-count {
      font-size: 10px;
      color: var(--muted);
    }

    #job-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 340px;
      overflow-y: auto;
    }

    #job-list::-webkit-scrollbar {
      width: 3px;
    }
    #job-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #job-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    /* ── Empty state ────────────────────────────────────── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
      gap: 8px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    #empty-state .empty-icon {
      font-size: 24px;
      opacity: 0.5;
    }

    #empty-state p {
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Job card ───────────────────────────────────────── */
    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .job-card.success { border-left: 3px solid var(--green); }
    .job-card.error   { border-left: 3px solid var(--red); }
    .job-card.running { border-left: 3px solid #a3a3a3; }
    .job-card.pending { border-left: 3px solid var(--muted); }

    .job-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .job-name {
      font-weight: 500;
      font-size: 12px;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-status-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .job-status-badge.pending  { background: rgba(115,115,115,0.12); color: var(--muted); }
    .job-status-badge.running  { background: rgba(163,163,163,0.12); color: #a3a3a3; }
    .job-status-badge.success  { background: var(--green-dim); color: var(--green); }
    .job-status-badge.error    { background: rgba(248,113,113,0.12); color: var(--red); }

    /* Progress bar */
    .job-progress {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .job-progress-fill {
      height: 100%;
      border-radius: 2px;
      background: #a3a3a3;
      transition: width 0.4s ease;
    }

    .job-card.success .job-progress-fill { background: var(--green); width: 100% !important; }
    .job-card.error   .job-progress-fill { background: var(--red);   width: 100% !important; }

    .job-progress-fill.indeterminate {
      width: 40% !important;
      animation: indeterminate 1.4s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Meta line */
    .job-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .job-detail {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .job-detail.err { color: var(--red); }

    .job-time {
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* ── Auth screen ────────────────────────────────────── */
    #auth-screen {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #auth-screen .auth-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    #auth-screen .auth-subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: -6px;
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .auth-field label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .auth-field input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-field input:focus {
      border-color: #525252;
    }

    #auth-error {
      font-size: 11px;
      color: var(--red);
      display: none;
    }

    #auth-btn {
      background: var(--text);
      color: #0a0a0a;
      border: none;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
      width: 100%;
    }

    #auth-btn:hover { opacity: 0.85; }
    #auth-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Workspace selector ─────────────────────────────── */
    #workspace-screen {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      display: none;
    }

    #workspace-screen .auth-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .workspace-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .workspace-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.15s, background 0.15s;
    }

    .workspace-item:hover {
      border-color: #525252;
      background: var(--surface2);
    }

    .workspace-item.selected {
      border-color: var(--green);
      background: var(--green-dim);
    }

    .workspace-item .ws-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .workspace-item .ws-meta {
      font-size: 10px;
      color: var(--muted);
    }

    #ws-confirm-btn {
      background: var(--text);
      color: #0a0a0a;
      border: none;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    #ws-confirm-btn:hover { opacity: 0.85; }
    #ws-confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── User bar (shown when logged in) ────────────────── */
    #user-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin: 8px 12px 0;
    }

    #user-bar .user-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    #user-bar .user-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
    }

    #user-bar .workspace-name {
      font-size: 10px;
      color: var(--muted);
    }

    #logout-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-size: 10px;
      font-family: inherit;
      cursor: pointer;
      padding: 3px 8px;
      transition: color 0.2s, border-color 0.2s;
    }

    #logout-btn:hover {
      color: var(--text);
      border-color: #525252;
    }

    /* ── Info row ───────────────────────────────────────── */
    #info-row {
      display: flex;
      gap: 6px;
    }

    .info-chip {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-chip .chip-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
    }

    .info-chip .chip-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- Header (always visible) -->
  <div id="header">
    <div id="header-left">
      <div id="logo">
        <!-- Icon only, wordmark as separate element -->
        <svg width="18" height="18" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11.266 27.384C9.93899 26.8852 9.30425 25.3732 9.87752 24.0766L11.3818 20.6742C11.7795 19.7747 10.9836 18.8058 10.024 19.0213L6.38898 19.8378C4.99844 20.1501 3.63171 19.2278 3.40094 17.8215C3.17032 16.4159 4.16937 15.1058 5.58582 14.9562L9.27169 14.5671C10.2511 14.4637 10.6932 13.2875 10.0245 12.5645L7.50759 9.84375C6.54037 8.79818 6.65171 7.15436 7.75108 6.24877C8.8511 5.34263 10.4869 5.54901 11.3274 6.69998L13.5246 9.70872C14.1046 10.503 15.3417 10.2983 15.6349 9.35957L16.7444 5.80868C17.1672 4.45549 18.6406 3.73605 19.9677 4.23488C21.2925 4.73287 21.9278 6.24086 21.3587 7.5367L19.8596 10.9499C19.4639 11.8509 20.2612 12.819 21.2214 12.6034L24.8602 11.7861C26.25 11.4739 27.616 12.3957 27.8466 13.8013C28.0773 15.2071 27.0772 16.5172 25.6602 16.6652L21.9644 17.0513C20.983 17.1538 20.5399 18.3327 21.2107 19.0563L23.7371 21.7813C24.7057 22.826 24.5952 24.4705 23.4956 25.3763C22.3962 26.282 20.7613 26.0757 19.9212 24.9254L17.7218 21.9135C17.1414 21.1187 15.9038 21.3219 15.608 22.2605L14.4875 25.816C14.0621 27.1658 12.5908 27.882 11.266 27.384Z" fill="#e5e5e5"/>
        </svg>
        <span id="app-name">tokenhaus</span>
      </div>
    </div>
    <div id="header-right">
      <div id="mcp-badge" class="disconnected">
        <span class="dot"></span>
        <span id="mcp-label">Connecting</span>
      </div>
      <button id="toggle-btn" title="Collapse / Expand">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M10.5 5.5L7 9L3.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Auth screen (shown when not logged in) -->
  <div id="auth-screen">
    <div class="auth-title">Sign in to Tokenhaus</div>
    <div class="auth-subtitle">Connect to your design system workspace</div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="off" />
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" />
    </div>
    <div id="auth-error"></div>
    <button id="auth-btn">Sign in</button>
  </div>

  <!-- Workspace selector (shown after login if multiple workspaces) -->
  <div id="workspace-screen">
    <div class="auth-title">Select Workspace</div>
    <div class="workspace-list" id="workspace-list"></div>
    <button id="ws-confirm-btn" disabled>Continue</button>
  </div>

  <!-- User bar (shown when logged in, above main content) -->
  <div id="user-bar">
    <div class="user-info">
      <span class="user-name" id="user-bar-name"></span>
      <span class="workspace-name" id="user-bar-workspace"></span>
    </div>
    <button id="logout-btn">Sign out</button>
  </div>

  <!-- Expandable content -->
  <div id="main-content" style="display:none">

    <!-- Info chips -->
    <div id="info-row">
      <div class="info-chip">
        <span class="chip-label">Jobs Done</span>
        <span class="chip-value" id="chip-done">0</span>
      </div>
      <div class="info-chip">
        <span class="chip-label">Errors</span>
        <span class="chip-value" id="chip-errors">0</span>
      </div>
      <div class="info-chip">
        <span class="chip-label">Running</span>
        <span class="chip-value" id="chip-running">0</span>
      </div>
    </div>

    <!-- Job queue -->
    <div id="queue-section">
      <div id="queue-header">
        <span class="section-label">Job Queue</span>
        <span id="queue-count"></span>
      </div>
      <div id="job-list">
        <div id="empty-state">
          <div class="empty-icon">⚡</div>
          <p>Waiting for commands from<br>Claude or the Dashboard</p>
        </div>
      </div>
    </div>

  </div>

  <script src="ui.js"></script>
</body>
</html>
