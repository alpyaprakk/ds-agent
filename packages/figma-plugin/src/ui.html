<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tokenhaus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --accent: #d4d4d4;
      --accent-dim: rgba(212,212,212,0.08);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.10);
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e5e5e5;
      --muted: #737373;
      --radius: 8px;
    }

    html, body {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── Collapsed state ───────────────────────────────── */
    body.collapsed {
      height: 48px;
    }

    body.collapsed #main-content { display: none; }

    /* ── Header ────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      user-select: none;
      cursor: default;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    #app-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* MCP Status badge */
    #mcp-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: all 0.3s;
    }

    #mcp-badge.connected {
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid rgba(74,222,128,0.2);
    }

    #mcp-badge.disconnected {
      background: rgba(115,115,115,0.10);
      color: var(--muted);
      border: 1px solid rgba(115,115,115,0.18);
    }

    #mcp-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    #mcp-badge.connected .dot {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Collapse toggle */
    #toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s, background 0.2s;
      width: auto;
      margin: 0;
    }

    #toggle-btn:hover {
      color: var(--text);
      background: var(--surface2);
    }

    #toggle-btn svg {
      transition: transform 0.25s ease;
    }

    body.collapsed #toggle-btn svg {
      transform: rotate(180deg);
    }

    /* ── Main content ───────────────────────────────────── */
    #main-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Job Queue ─────────────────────────────────────── */
    #queue-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #queue-count {
      font-size: 10px;
      color: var(--muted);
    }

    #job-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 340px;
      overflow-y: auto;
    }

    #job-list::-webkit-scrollbar {
      width: 3px;
    }
    #job-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #job-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    /* ── Empty state ────────────────────────────────────── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
      gap: 8px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    #empty-state .empty-icon {
      font-size: 24px;
      opacity: 0.5;
    }

    #empty-state p {
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Job card ───────────────────────────────────────── */
    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .job-card.success { border-left: 3px solid var(--green); }
    .job-card.error   { border-left: 3px solid var(--red); }
    .job-card.running { border-left: 3px solid #a3a3a3; }
    .job-card.pending { border-left: 3px solid var(--muted); }

    .job-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .job-name {
      font-weight: 500;
      font-size: 12px;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-status-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .job-status-badge.pending  { background: rgba(115,115,115,0.12); color: var(--muted); }
    .job-status-badge.running  { background: rgba(163,163,163,0.12); color: #a3a3a3; }
    .job-status-badge.success  { background: var(--green-dim); color: var(--green); }
    .job-status-badge.error    { background: rgba(248,113,113,0.12); color: var(--red); }

    /* Progress bar */
    .job-progress {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .job-progress-fill {
      height: 100%;
      border-radius: 2px;
      background: #a3a3a3;
      transition: width 0.4s ease;
    }

    .job-card.success .job-progress-fill { background: var(--green); width: 100% !important; }
    .job-card.error   .job-progress-fill { background: var(--red);   width: 100% !important; }

    .job-progress-fill.indeterminate {
      width: 40% !important;
      animation: indeterminate 1.4s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Meta line */
    .job-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .job-detail {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .job-detail.err { color: var(--red); }

    .job-time {
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* ── Info row ───────────────────────────────────────── */
    #info-row {
      display: flex;
      gap: 6px;
    }

    .info-chip {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-chip .chip-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
    }

    .info-chip .chip-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- Header (always visible) -->
  <div id="header">
    <div id="header-left">
      <div id="logo">
        <!-- Tokenhaus logo mark: token grid + haus roof -->
        <svg width="84" height="20" viewBox="0 0 84 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Icon: 2x2 token grid with roof line -->
          <rect x="0" y="8" width="5" height="5" rx="1" fill="#e5e5e5"/>
          <rect x="7" y="8" width="5" height="5" rx="1" fill="#e5e5e5"/>
          <rect x="0" y="15" width="5" height="5" rx="1" fill="#737373"/>
          <rect x="7" y="15" width="5" height="5" rx="1" fill="#737373"/>
          <polyline points="0,7 6,2 12,7" stroke="#e5e5e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <!-- Wordmark -->
          <text x="18" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#e5e5e5" letter-spacing="-0.2">tokenhaus</text>
        </svg>
      </div>
    </div>
    <div id="header-right">
      <div id="mcp-badge" class="disconnected">
        <span class="dot"></span>
        <span id="mcp-label">Connecting</span>
      </div>
      <button id="toggle-btn" title="Collapse / Expand">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M10.5 5.5L7 9L3.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Expandable content -->
  <div id="main-content">

    <!-- Info chips -->
    <div id="info-row">
      <div class="info-chip">
        <span class="chip-label">Jobs Done</span>
        <span class="chip-value" id="chip-done">0</span>
      </div>
      <div class="info-chip">
        <span class="chip-label">Errors</span>
        <span class="chip-value" id="chip-errors">0</span>
      </div>
      <div class="info-chip">
        <span class="chip-label">Running</span>
        <span class="chip-value" id="chip-running">0</span>
      </div>
    </div>

    <!-- Job queue -->
    <div id="queue-section">
      <div id="queue-header">
        <span class="section-label">Job Queue</span>
        <span id="queue-count"></span>
      </div>
      <div id="job-list">
        <div id="empty-state">
          <div class="empty-icon">⚡</div>
          <p>Waiting for commands from<br>Claude or the Dashboard</p>
        </div>
      </div>
    </div>

  </div>

  <script src="ui.js"></script>
</body>
</html>
