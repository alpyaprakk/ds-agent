<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DS Agent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px;
      background: #f9fafb;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #111827;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
    }

    button:hover {
      background: #2563eb;
    }

    #status {
      margin-top: 16px;
      padding: 12px;
      background: white;
      border-radius: 6px;
      font-size: 13px;
      color: #6b7280;
      border: 1px solid #e5e7eb;
    }

    .section {
      margin-bottom: 24px;
    }

    .label {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <h1>🤖 DS Agent</h1>

  <div class="section">
    <div class="label">Actions</div>
    <button id="get-variables">Get Variables</button>
    <button id="get-components">Get Components</button>
    <button id="sync">Sync with Server</button>
  </div>

  <div id="status">Ready</div>

  <script>
    // WebSocket connection
    let ws = null;
    let reconnectInterval = null;
    const SERVER_URL = 'wss://ds-agent.alpy.io'; // TODO: Make configurable

    // Connect to server
    function connectToServer() {
      try {
        ws = new WebSocket(SERVER_URL);

        ws.onopen = () => {
          console.log('✅ Connected to DS Agent server');
          document.getElementById('status').textContent = '🟢 Connected to server';

          // Send authentication
          ws.send(JSON.stringify({
            type: 'plugin-connect',
            plugin: 'figma',
            timestamp: new Date().toISOString()
          }));

          // Start heartbeat
          startHeartbeat();
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          console.log('Server message:', msg);

          if (msg.type === 'sync-request') {
            // Server requested sync
            performSync();
          }

          if (msg.type === 'apply-fix') {
            // Server sent a fix to apply
            console.log('Applying fix from server:', msg);
            parent.postMessage({
              pluginMessage: {
                type: 'apply-fix',
                fix: msg
              }
            }, '*');

            document.getElementById('status').textContent = '🔧 Applying fix...';
          }
        };

        ws.onerror = (error) => {
          console.error('WebSocket error:', error);
          document.getElementById('status').textContent = '🔴 Connection error';
        };

        ws.onclose = () => {
          console.log('❌ Disconnected from server');
          document.getElementById('status').textContent = '🔴 Disconnected';

          // Attempt reconnect
          reconnectInterval = setTimeout(connectToServer, 5000);
        };
      } catch (error) {
        console.error('Connection error:', error);
        document.getElementById('status').textContent = '🔴 Failed to connect';
        reconnectInterval = setTimeout(connectToServer, 5000);
      }
    }

    // Heartbeat to keep connection alive
    let heartbeatInterval = null;
    function startHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);

      heartbeatInterval = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'heartbeat' }));
        }
      }, 30000); // Every 30 seconds
    }

    // Perform full sync
    function performSync() {
      document.getElementById('status').textContent = '🔄 Syncing...';

      // Request variables and components from plugin code
      parent.postMessage({ pluginMessage: { type: 'full-sync' } }, '*');
    }

    // Get Variables
    document.getElementById('get-variables').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'get-variables' } }, '*');
      document.getElementById('status').textContent = 'Fetching variables...';
    };

    // Get Components
    document.getElementById('get-components').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'get-components' } }, '*');
      document.getElementById('status').textContent = 'Fetching components...';
    };

    // Sync
    document.getElementById('sync').onclick = () => {
      performSync();
    };

    // Listen for messages from plugin code
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'variables-data') {
        document.getElementById('status').textContent =
          `Found ${msg.variables.length} variables`;
        console.log('Variables:', msg.variables);
      }

      if (msg.type === 'components-data') {
        document.getElementById('status').textContent =
          `Found ${msg.components.length} components`;
        console.log('Components:', msg.components);
      }

      if (msg.type === 'sync-data') {
        // Send sync data to server
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'design-system-sync',
            data: msg.data
          }));
          document.getElementById('status').textContent = '✅ Synced with server';
        } else {
          document.getElementById('status').textContent = '❌ Not connected to server';
        }
      }

      if (msg.type === 'fix-applied') {
        document.getElementById('status').textContent = '✅ Fix applied successfully';

        // Notify server
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'fix-applied',
            conflictId: msg.conflictId,
            success: true
          }));
        }
      }

      if (msg.type === 'fix-error') {
        document.getElementById('status').textContent = '❌ Fix failed: ' + msg.error;

        // Notify server
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'fix-applied',
            conflictId: msg.conflictId,
            success: false,
            error: msg.error
          }));
        }
      }
    };

    // Connect on load
    connectToServer();

    // Cleanup on unload
    window.onbeforeunload = () => {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      if (reconnectInterval) clearTimeout(reconnectInterval);
      if (ws) ws.close();
    };
  </script>
</body>
</html>
